# Automatic update pull requests (architecture review 6, option B, #82).
# Every Monday, Dependabot opens pull requests for the npm packages, the base images in
# deploy/Dockerfile and the GitHub Actions in CI. Minor and patch updates are grouped
# so they arrive as one pull request per ecosystem. CI tests each one; nothing merges
# without the owner's approval. Versions stay pinned exactly (package.json, Dockerfile).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: increase
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript stays on 6.0 until typescript-eslint supports 7 (AGENTS.md).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Types follow the Node major the app runs on (24).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        update-types: [minor, patch]
    ignore:
      # The app runs on Node 24 (LTS); a new major is a planned change, not a weekly one.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]
